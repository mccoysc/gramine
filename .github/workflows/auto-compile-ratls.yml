name: Auto-compile RA-TLS Libraries

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/auto-compile-ratls.yml'
      - 'tools/sgx/ra-tls/**'
      - '!tools/sgx/ra-tls/prebuilt/**'
  pull_request:
    paths:
      - '.github/workflows/auto-compile-ratls.yml'
      - 'tools/sgx/ra-tls/**'
      - '!tools/sgx/ra-tls/prebuilt/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-compile-ratls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-commit:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-dev \
            ninja-build meson pkg-config cmake build-essential \
            libprotobuf-c-dev protobuf-c-compiler \
            libcurl4-openssl-dev \
            nasm
            
      - name: Install Intel SGX DCAP dependencies
        run: |
          # Add Intel SGX APT repository
          curl -fsSL https://download.01.org/intel-sgx/sgx_repo/ubuntu/intel-sgx-deb.key | sudo gpg --dearmor -o /usr/share/keyrings/intel-sgx.gpg
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/intel-sgx.gpg] https://download.01.org/intel-sgx/sgx_repo/ubuntu jammy main' | sudo tee /etc/apt/sources.list.d/intel-sgx.list
          sudo apt-get update
          
          # Install DCAP development libraries
          sudo apt-get install -y \
            libsgx-dcap-ql-dev \
            libsgx-dcap-quote-verify-dev \
            libsgx-headers \
            libsgx-urts
            
      - name: Verify build environment
        run: |
          echo "=== System Information ==="
          uname -m
          echo ""
          echo "=== PATH ==="
          echo "$PATH"
          echo ""
          echo "=== Verify nasm ==="
          command -v nasm || { echo "ERROR: nasm not found on PATH"; exit 1; }
          nasm -v
          echo ""
          echo "=== nasm package info ==="
          dpkg -l nasm || apt-cache policy nasm
            
      - name: Configure meson build
        run: |
          env -u PYENV_ROOT -u PYENV_SHELL \
            PATH="/usr/bin:/usr/local/bin:/bin:/usr/sbin:/sbin:$PATH" \
            meson setup build/ \
              --buildtype=release \
              -Dsgx=enabled \
              -Ddirect=disabled \
              -Dlibc=none \
              -Dtests=disabled \
              -Ddcap=enabled
              
      - name: Compile RA-TLS libraries
        run: |
          ninja -C build/ \
            tools/sgx/ra-tls/libra_tls_attest.so \
            tools/sgx/ra-tls/libra_tls_verify.a \
            tools/sgx/ra-tls/libra_tls_verify_dcap.so \
            tools/sgx/ra-tls/libra_tls_verify_dcap_gramine.so \
            tools/sgx/ra-tls/libratls-quote-verify.so \
            tools/sgx/ra-tls/libsecret_prov_attest.so \
            tools/sgx/ra-tls/libsecret_prov_verify.a \
            tools/sgx/ra-tls/libsecret_prov_verify_dcap.so
            
      - name: Copy compiled libraries to prebuilt directory
        run: |
          cp build/tools/sgx/ra-tls/libra_tls_attest.so tools/sgx/ra-tls/prebuilt/
          cp build/tools/sgx/ra-tls/libra_tls_verify.a tools/sgx/ra-tls/prebuilt/
          cp build/tools/sgx/ra-tls/libra_tls_verify_dcap.so tools/sgx/ra-tls/prebuilt/
          cp build/tools/sgx/ra-tls/libra_tls_verify_dcap_gramine.so tools/sgx/ra-tls/prebuilt/
          cp build/tools/sgx/ra-tls/libratls-quote-verify.so tools/sgx/ra-tls/prebuilt/
          cp build/tools/sgx/ra-tls/libsecret_prov_attest.so tools/sgx/ra-tls/prebuilt/
          cp build/tools/sgx/ra-tls/libsecret_prov_verify.a tools/sgx/ra-tls/prebuilt/
          cp build/tools/sgx/ra-tls/libsecret_prov_verify_dcap.so tools/sgx/ra-tls/prebuilt/
          
      - name: Check if libraries changed
        id: check_changes
        run: |
          git add tools/sgx/ra-tls/prebuilt/*.so
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to prebuilt libraries"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Prebuilt libraries have changed"
          fi
          
      - name: Check branch is up to date
        id: up_to_date
        if: steps.check_changes.outputs.changed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -e
          git fetch origin master
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse origin/master)
          echo "Local HEAD:  $LOCAL"
          echo "Remote HEAD: $REMOTE"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "up_to_date=true" >> $GITHUB_OUTPUT
            echo "Branch is up-to-date with origin/master"
          else
            echo "up_to_date=false" >> $GITHUB_OUTPUT
            echo "Remote master advanced; skipping commit from outdated workflow run"
          fi
          
      - name: Commit and push prebuilt libraries
        if: steps.check_changes.outputs.changed == 'true' && steps.up_to_date.outputs.up_to_date == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-compile: Update prebuilt RA-TLS libraries" \
                     -m "Automatically compiled and updated prebuilt libraries after source code changes." \
                     -m "Link to workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin master
          
      - name: Upload prebuilt artifacts (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ratls-prebuilt-libs
          path: |
            build/tools/sgx/ra-tls/libra_tls_attest.so
            build/tools/sgx/ra-tls/libra_tls_verify.a
            build/tools/sgx/ra-tls/libra_tls_verify_dcap.so
            build/tools/sgx/ra-tls/libra_tls_verify_dcap_gramine.so
            build/tools/sgx/ra-tls/libratls-quote-verify.so
            build/tools/sgx/ra-tls/libsecret_prov_attest.so
            build/tools/sgx/ra-tls/libsecret_prov_verify.a
            build/tools/sgx/ra-tls/libsecret_prov_verify_dcap.so
